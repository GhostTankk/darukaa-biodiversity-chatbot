name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check src tests

      - name: Run tests
        # GEMINI_API_KEY is intentionally NOT required here: the test suite
        # only covers retrieval, slot-filling, and schema validation, which
        # are all deterministic and offline. Reasoning-engine calls to the
        # live API are exercised manually / in the demo, not in CI.
        run: pytest tests/ -v
